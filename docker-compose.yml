version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vayuindex_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./vayu_index.db
      - METHODOLOGY_VERSION=1.0.0-Jevons
      - WEIGHT_VERSION=2026.1
      - BASE_PERIOD=2026-01-01
    volumes:
      - backend_data:/app
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vayuindex_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  backend_data:
